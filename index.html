<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Небо и приливы — Известный мир</title>
<style>
:root{--ui-bg:rgba(14,18,26,.78);--ui-bg2:rgba(22,27,38,.92);--ui-line:rgba(255,255,255,.12);--ui-text:#e8e6e1;--ui-dim:#a7a49c;--ui-acc:#e8a33d;--ui-r:10px}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f16;color:var(--ui-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:fixed;inset:0}
/* scene */
#app .stage{position:absolute;inset:0;touch-action:none;cursor:grab}
#app .stage.drag{cursor:grabbing}
#app .stage .nbp-svgwrap{width:100%;height:100%;margin:0}
#app .stage svg.nbp-scene{width:100%;height:100%;display:block;min-height:0}
/* shared controls */
button,select,input{font:inherit;color:var(--ui-text);background:rgba(255,255,255,.06);border:1px solid var(--ui-line);border-radius:6px;padding:3px 8px}
button{cursor:pointer}button:hover{background:rgba(255,255,255,.12)}
select option{background:#1b2130}
input[type=range]{padding:0;background:transparent;border:none;accent-color:var(--ui-acc)}
input[type=checkbox]{padding:0;accent-color:var(--ui-acc)}
/* left panel */
.ui-panel{position:absolute;top:12px;left:12px;bottom:12px;width:min(340px,calc(100vw - 24px));background:var(--ui-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--ui-line);border-radius:var(--ui-r);display:flex;flex-direction:column;transition:transform .25s ease,opacity .25s ease;z-index:3}
.ui-panel.closed{transform:translateX(calc(-100% - 16px));opacity:0;pointer-events:none}
.ui-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--ui-line)}
.ui-head h1{font-size:16px;font-weight:600;margin:0;flex:1;letter-spacing:.01em}
.ui-head small{display:block;font-size:11px;color:var(--ui-dim);font-weight:400;margin-top:2px}
.ui-body{overflow-y:auto;padding:10px 14px 14px;flex:1;scrollbar-width:thin}
.ui-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ui-dim);margin:12px 0 6px}
.ui-sec:first-child{margin-top:2px}
.ui-panel .nbp-cr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px;font-size:13px;color:var(--ui-dim)}
.ui-panel .nbp-cr label{display:flex;align-items:center;gap:4px;color:var(--ui-text)}
.ui-panel .nbp-sl{display:grid;grid-template-columns:auto 1fr;gap:0 8px;margin:0 0 8px;font-size:12.5px;color:var(--ui-dim)}
.ui-panel .nbp-sl .nbp-l{grid-column:1;grid-row:1;min-width:0}
.ui-panel .nbp-sl .nbp-o{grid-column:2;grid-row:1;text-align:right;line-height:1.35;color:var(--ui-text);font-weight:500;min-width:0}
.ui-panel .nbp-sl input[type=range]{grid-column:1/3;grid-row:2;width:100%;margin:2px 0 0}
.ui-panel .nbp-det{margin:4px 0 6px;font-size:12.5px;color:var(--ui-dim)}.ui-panel .nbp-det summary{cursor:pointer;margin-bottom:6px}
.ui-panel select[data-k=city]{width:170px!important}.ui-panel select[data-k=mode]{width:150px!important}
/* right drawer */
.ui-drawer{position:absolute;top:58px;right:12px;width:min(360px,calc(100vw - 24px));max-height:calc(100% - 250px);overflow-y:auto;background:var(--ui-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--ui-line);border-radius:var(--ui-r);padding:10px 12px;transition:transform .25s ease,opacity .25s ease;z-index:3;scrollbar-width:thin}
.ui-drawer.closed{transform:translateX(calc(100% + 16px));opacity:0;pointer-events:none}
.ui-drawer .nbp-gd{display:grid;grid-template-columns:1fr;gap:6px;margin:0}
.ui-drawer .nbp-cd{background:rgba(255,255,255,.05);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--ui-dim);line-height:1.5}
.ui-drawer .nbp-cd b{display:block;font-size:12.5px;font-weight:600;color:var(--ui-text)}
.ui-drawer .nbp-svgwrap{width:100%;margin:8px 0 0}.ui-drawer .nbp-svgwrap svg{width:100%;height:auto;display:block}
.nbp-ts{font-size:12px;fill:var(--ui-dim)}
/* floating buttons */
.ui-fab{position:absolute;z-index:4;display:flex;gap:6px}
.ui-fab button{background:var(--ui-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--ui-line);border-radius:8px;padding:6px 10px;font-size:13px}
.ui-fab.l{top:12px;left:12px}.ui-fab.r{top:12px;right:12px}
.ui-fab.hide{display:none}
.ui-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;white-space:nowrap;font-size:11.5px;color:rgba(232,230,225,.6);z-index:2;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.ui-hint kbd,.ui-help kbd{font:600 11px ui-monospace,Menlo,Consolas,monospace;border:1px solid rgba(255,255,255,.3);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:rgba(255,255,255,.06);color:var(--ui-text)}
/* help */
.ui-help{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(6,8,12,.55)}
.ui-help.closed{display:none}
.ui-help .box{background:var(--ui-bg2);border:1px solid var(--ui-line);border-radius:var(--ui-r);padding:18px 22px;max-width:min(420px,calc(100vw - 32px));font-size:13.5px;line-height:1.6}
.ui-help h2{font-size:15px;margin:0 0 10px}
.ui-help table{border-collapse:collapse;width:100%}.ui-help td{padding:4px 0;vertical-align:top}.ui-help td:first-child{width:42%;padding-right:12px}
.ui-help p{margin:10px 0 0;color:var(--ui-dim);font-size:12px}
@media (max-width:700px){.ui-panel{top:56px}}

/* place row + map */
.ui-place{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ui-place .pname{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ui-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-place .pname small{display:block;font-size:11px;font-weight:400;color:var(--ui-dim)}
.ui-place button{white-space:nowrap}
.ui-map{position:absolute;inset:0;z-index:8;background:rgba(6,8,12,.55);display:flex;align-items:center;justify-content:center}
.ui-map.closed{display:none}
.ui-map .mbox{position:relative;width:min(1500px,calc(100vw - 32px));height:min(820px,calc(100vh - 32px));background:var(--ui-bg2);border:1px solid var(--ui-line);border-radius:var(--ui-r);display:flex;flex-direction:column;overflow:hidden}
.ui-map .mhead{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--ui-line);font-size:13px}
.ui-map .mhead b{font-size:14px}
.ui-map .mtip{flex:1;color:var(--ui-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-map .mwrap{flex:1;min-height:0;position:relative;background:#16293a}
.ui-map svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.ui-map svg.pan{cursor:grabbing}
.ui-map .mfoot{padding:6px 12px;font-size:11.5px;color:var(--ui-dim);border-top:1px solid var(--ui-line)}
.ui-map .mfoot kbd{font:600 11px ui-monospace,Menlo,Consolas,monospace;border:1px solid rgba(255,255,255,.3);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.ui-map .city text{fill:#f3efe4;paint-order:stroke;stroke:#10161f;stroke-linejoin:round;pointer-events:none}
.ui-map .city circle{fill:#f2c14e;stroke:#1b1406}
.ui-map .city.cap circle.o{fill:none;stroke:#f2c14e}
.ui-map .city.hot circle{fill:#fff}
body.ui-off .ui-panel,body.ui-off .ui-drawer,body.ui-off .ui-fab,body.ui-off .ui-map,body.ui-off .ui-hint{display:none}
</style></head><body>

for(const g of gCities.children){const rr=g._r*k,[o,i,t]=g.children;i.setAttribute('r',rr);i.setAttribute('stroke-width',1.2*k);o.setAttribute('r',g._cap?rr+3*k:0);o.setAttribute('stroke-width',1.4*k);t.setAttribute('y',g._y-rr-4*k);t.setAttribute('font-size',(g._cap?13:11.5)*k);t.setAttribute('font-weight',g._cap?600:400);t.setAttribute('stroke-width',3*k);}
const h=A.here(),p=A.toPx(h.la,h.lo),dot=gMe.querySelector('.dot'),cone=gMe.querySelector('.cone');dot.setAttribute('cx',p[0]);dot.setAttribute('cy',p[1]);dot.setAttribute('r',5*k);dot.setAttribute('stroke-width',1.5*k);
const L=46*k,f=h.mode==='pan'?360:Math.min(h.fov,170),a0=(h.yaw-f/2)*Math.PI/180,a1=(h.yaw+f/2)*Math.PI/180,P=a=>[p[0]+L*Math.sin(a),p[1]-L*Math.cos(a)];
cone.setAttribute('d',f>=360?`M${p[0]-L} ${p[1]}a${L} ${L} 0 1 0 ${2*L} 0a${L} ${L} 0 1 0 ${-2*L} 0`:`M${p[0]} ${p[1]}L${P(a0).join(' ')}A${L} ${L} 0 ${f>180?1:0} 1 ${P(a1).join(' ')}Z`);cone.setAttribute('stroke-width',k);}
const setVB=()=>{if(VB.y<TRIM)VB.y=TRIM;msvg.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);sizeMap();};
const toMap=e=>{const pt=msvg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=pt.matrixTransform(msvg.getScreenCTM().inverse());return[m.x,m.y];};
const pickCityAt=(m,e)=>{const r=msvg.getBoundingClientRect(),k=Math.max(VB.w/r.width,VB.h/r.height);let best=null,bd=1e9;for(const g of gCities.children){const d=Math.hypot(g._x-m[0],g._y-m[1]);if(d<bd){bd=d;best=g;}}return best&&bd<=best._r*k+9*k?best:null;};
function openMap(v){const open=v===undefined?map.classList.contains('closed'):v;map.classList.toggle('closed',!open);if(open){const first=!built;if(!built)buildMap();requestAnimationFrame(()=>{if(first){const r=msvg.getBoundingClientRect(),ba=r.width/r.height,ma=MC.W/MC.H;if(ba<ma*0.75){const h=A.here(),p=A.toPx(h.la,h.lo),hh=MC.H*0.9,ww=hh*ba;VB={x:Math.max(-ww*0.1,Math.min(MC.W-ww*0.9,p[0]-ww/2)),y:TRIM,w:ww,h:Math.min(hh,MC.H-TRIM)};}}setVB();});}}
let mdrag=null,hot=null;const PT=new Map();let pinch=null;
const zoomAt=(m,kk)=>{const w=Math.max(120,Math.min(MC.W*1.6,VB.w*kk));kk=w/VB.w;VB.x=m[0]-(m[0]-VB.x)*kk;VB.y=m[1]-(m[1]-VB.y)*kk;VB.w=w;VB.h=VB.h*kk;setVB();};
msvg.addEventListener('pointerdown',e=>{PT.set(e.pointerId,[e.clientX,e.clientY]);if(PT.size===2){const[a,b]=[...PT.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])};mdrag=null;}},true);
msvg.addEventListener('pointermove',e=>{if(!PT.has(e.pointerId))return;PT.set(e.pointerId,[e.clientX,e.clientY]);if(pinch&&PT.size===2){const[a,b]=[...PT.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d>0){const m=toMap({clientX:(a[0]+b[0])/2,clientY:(a[1]+b[1])/2});zoomAt(m,pinch.d/d);pinch.d=d;}e.stopImmediatePropagation();}},true);
const ptUp=e=>{PT.delete(e.pointerId);if(PT.size<2&&pinch){pinch=null;mdrag=null;e.stopImmediatePropagation();}};msvg.addEventListener('pointerup',ptUp,true);msvg.addEventListener('pointercancel',ptUp,true);
msvg.addEventListener('pointerdown',e=>{if(pinch)return;mdrag={x:e.clientX,y:e.clientY,vb:{...VB},moved:false};msvg.setPointerCapture(e.pointerId);});
msvg.addEventListener('pointermove',e=>{const m=toMap(e);if(mdrag){const dx=e.clientX-mdrag.x,dy=e.clientY-mdrag.y;if(Math.hypot(dx,dy)>4){mdrag.moved=true;msvg.classList.add('pan');}if(mdrag.moved){const r=msvg.getBoundingClientRect(),k=Math.max(VB.w/r.width,VB.h/r.height);VB.x=mdrag.vb.x-dx*k;VB.y=mdrag.vb.y-dy*k;setVB();}return;}
const g=pickCityAt(m);if(hot!==g){if(hot)hot.classList.remove('hot');hot=g;if(g)g.classList.add('hot');}const ll=A.toLL(m[0],m[1]);
if(g){const b=A.DATA.burgs[+g.dataset.i-1];mtip.textContent=`${A.PRE[+g.dataset.i][0]} · ${b[6]?b[6].toLocaleString('ru-RU')+' жителей':'население не указано'}${b[4]?' · столица':''}`;}else if(m[0]>=0&&m[0]<=MC.W&&m[1]>=0&&m[1]<=MC.H){const nb=nearestBurg(m[0],m[1]);mtip.textContent=`${fmtLL(ll[0],ll[1])} · ${Math.round(nb.km)} км от: ${A.DATA.burgs[nb.i][0]}`;}else mtip.textContent='';});
msvg.addEventListener('pointerup',e=>{const d=mdrag;mdrag=null;msvg.classList.remove('pan');if(!d||d.moved)return;const m=toMap(e);if(m[0]<0||m[0]>MC.W||m[1]<TRIM||m[1]>MC.H)return;const g=pickCityAt(m);
if(g)A.pickCity(+g.dataset.i);else{const ll=A.toLL(m[0],m[1]);A.goTo(ll[0],ll[1]);}
q('yaw').value=Math.round(+q('seaD').value)%360;q('pit').value=4;fire('yaw');updPlace();openMap(false);});
msvg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(toMap(e),Math.exp(e.deltaY*0.0015));},{passive:false});
map.addEventListener('click',e=>{if(e.target===map)openMap(false);});
addEventListener('resize',()=>{if(!map.classList.contains('closed'))sizeMap();});
updPlace();
// ---- one redraw per frame for drag / wheel / resize ----
let pend=null;const later=fn=>{pend=fn;if(!later.r)later.r=requestAnimationFrame(()=>{later.r=0;const f=pend;pend=null;f&&f();});};
const fire=k=>q(k).dispatchEvent(new Event('input'));
// drag to look
let drag=null;const svg=stage.querySelector('svg');
stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,yaw:+q('yaw').value,pit:+q('pit').value};stage.setPointerCapture(e.pointerId);stage.classList.add('drag');});
stage.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),fov=q('mode').value==='pan'?360:+q('fov').value,k=fov/r.width,dx=e.clientX-drag.x,dy=e.clientY-drag.y;
const yaw=+((((drag.yaw-dx*k)%360)+360)%360).toFixed(2),pit=+Math.max(-60,Math.min(90,drag.pit+dy*k)).toFixed(2);later(()=>{if(+q('yaw').value!==yaw){q('yaw').value=yaw;}q('pit').value=pit;fire('yaw');});});
const endDrag=e=>{if(!drag)return;drag=null;stage.classList.remove('drag');};
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
// wheel to zoom
stage.addEventListener('wheel',e=>{e.preventDefault();const f=+q('fov').value,n=Math.max(20,Math.min(180,Math.round(f*Math.exp(e.deltaY*0.0012))));if(n!==f)later(()=>{q('fov').value=n;fire('fov');});},{passive:false});
// resize to the window
addEventListener('resize',()=>later(()=>S.resize(innerWidth,innerHeight)));
// hotkeys
app.addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.blur();});
addEventListener('keydown',e=>{const t=e.target,typing=t&&(t.tagName==='INPUT'&&t.type!=='range'&&t.type!=='checkbox'||t.tagName==='SELECT'||t.tagName==='TEXTAREA');if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
if(e.code==='Space'){e.preventDefault();q('play').click();}
else if(e.code==='KeyH'){document.body.classList.toggle('ui-off');}
else if(e.code==='KeyM'){openMap();}
else if(e.code==='KeyI'){setDrawer(drawer.classList.contains('closed'));}
else if(e.key==='?'||e.code==='Slash'&&e.shiftKey){toggleHelp();}
else if(e.code==='Escape'){toggleHelp(false);openMap(false);}});
// fit once the layout has settled
requestAnimationFrame(()=>S.resize(innerWidth,innerHeight));
})();
</script>
